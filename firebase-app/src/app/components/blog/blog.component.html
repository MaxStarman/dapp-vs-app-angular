<div class="container">
	<h1 *ngIf="singedIn$ else signInAgain">
		Welcome <b>{{username}}</b>. <br>
		You are logged in as
		<!--                <b *ngIf="user.admin">admin</b>-->
		<b>user</b> with ID {{userId}}.
	</h1>
	<ng-template #signInAgain>
		<h1>Session has expired. Sing in again.</h1>
	</ng-template>
</div>

<div class="container">
	<app-button
		(click)="openModal()"
	>
		Add image
	</app-button>
</div>

<display-content></display-content>
