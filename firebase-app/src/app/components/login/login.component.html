<div class="container d-flex justify-content-center">
	<mat-card class="login-container">
		<h2>Sign In Form</h2>
		<form [formGroup]="userLoginForm">
			<mat-form-field class="primary-color">
				<mat-label>Username</mat-label>
				<input formControlName="username" matInput>
				<mat-hint>For display purposes.</mat-hint>
				<mat-error
					*ngIf="userLoginForm.controls?.['username']?.errors && userLoginForm.controls?.['username']?.touched">
					Username is required
				</mat-error>
			</mat-form-field>
			<mat-form-field class="primary-color">
				<mat-label>Email</mat-label>
				<input formControlName="email" matInput placeholder="info@example.com">
				<mat-error *ngIf="userLoginForm.get('email')!.hasError('required')">
					Email is required
				</mat-error>
				<mat-error *ngIf="userLoginForm.get('email')!.hasError('email')">
					Email is invalid
				</mat-error>
			</mat-form-field>
			<mat-form-field class="primary-color">
				<mat-label>Password</mat-label>
				<input formControlName="password" matInput>
				<mat-error *ngIf="userLoginForm.get('password')!.hasError('required')">
					Password is required
				</mat-error>
				<mat-error *ngIf="userLoginForm.get('password')!.hasError('minLength')">
					Password too short
				</mat-error>
			</mat-form-field>
			<div class="d-flex justify-content-between">
				<app-button
					(click)="signIn()"
					[disabled]="userLoginForm.invalid"
					[type]="'submit'"
					classList="mb-2"
				>
					<div *ngIf="!signingIn else buttonSpinner">
						<i class="fa-solid fa-arrow-right-to-bracket"></i>
						Sign in
					</div>
				</app-button>
				<app-button
					(click)="registerUser()"
					[disabled]="userLoginForm.invalid"
					[type]="'submit'"
					classList="mb-2"
				>
					<div *ngIf="!registering else buttonSpinner">
						<i class="fa-solid fa-arrow-right-to-bracket"></i>
						Register
					</div>
				</app-button>
			</div>
		</form>
	</mat-card>
</div>

<ng-template #buttonSpinner>
	<span class="button-loader">
		<mat-spinner color="accent" diameter="20"></mat-spinner>
	</span>
</ng-template>
