<div class="container d-flex justify-content-center">
	<ng-container *ngIf="!(authService.signedIn$ | async) else singedIn">
		<mat-card class="login-container">
			<h2>Sign In Form</h2>
			<form [formGroup]="userLoginForm">
				<mat-form-field>
					<mat-label>Username</mat-label>
					<input formControlName="username" matInput>
					<mat-hint>For display purposes.</mat-hint>
					<mat-error
						*ngIf="userLoginForm.controls?.['username']?.errors && userLoginForm.controls?.['username']?.touched">
						Please enter a correct username
					</mat-error>
				</mat-form-field>
				<div>
					<app-button
						(click)="signInII()"
						[disabled]="userLoginForm.invalid"
						[type]="'submit'"
						classList="my-2"
					>
						<i class="fa-solid fa-arrow-right-to-bracket"></i>
						Sign In with INTERNET IDENTITY
					</app-button>
					<app-button
						(click)="singInNFID()"
						[disabled]="userLoginForm.invalid"
						[type]="'submit'"
					>
						<i class="fa-solid fa-arrow-right-to-bracket"></i>
						Sign In with NFID
					</app-button>
				</div>
			</form>
		</mat-card>
	</ng-container>
</div>


<ng-template #singedIn>

	<div *ngIf="authService.currentUser$ | async as currUser" class="mb-3 mx-2 border">
		<pre>
			{{ currUser.data | json }}
		</pre>
	</div>
	<app-button
		(click)="navigateToBlog()"
		*ngIf="signedIn$ | async"
	>
		Go to blog
	</app-button>

</ng-template>
