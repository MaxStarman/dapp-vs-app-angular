<ng-container
	*ngIf="signedIn$ | async; else notSignedIn"
>

	<div class="login-container">
		<h2>Welcome to my page!</h2>
		<p>You are singed in as a User.</p>
		<button (click)="singOutSubmit()" type="button">Sign-out</button>
	</div>

</ng-container>

<ng-template #notSignedIn>

	<div class="login-container">
		<form
			#loginForm="ngForm"
			(ngSubmit)="signInSubmit()"
			class="sign-in-form"
		>
			<h2>Sign In</h2>
			<div class="form-group">
				<label for="username">Username: (*)</label>
				<input [(ngModel)]="user.username"
					   class="form-control"
					   id="username"
					   name="username"
					   required
					   type="text"
				>
			</div>
			<div class="form-group">
				<label for="email">Email:</label>
				<input [(ngModel)]="user.email"
					   class="form-control"
					   id="email"
					   name="email"
					   type="email"
				>
			</div>
			<button
				[disabled]="!loginForm.control.valid"
				class="btn btn-primary"
				type="submit"
			>
				Sign In
			</button>
		</form>
	</div>

</ng-template>
