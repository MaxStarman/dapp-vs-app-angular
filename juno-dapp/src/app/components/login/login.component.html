<div class="container d-flex justify-content-center">
	<ng-container *ngIf="!(authService.signedIn$ | async) else singedIn">
		<mat-card class="login-container">
			<h2>Sign in if you want to continue</h2>
			<div>
				<app-button
					(click)="signInII()"
					[type]="'submit'"
					classList="my-2"
				>
					<i class="fa-solid fa-arrow-right-to-bracket"></i>
					Sign In with INTERNET IDENTITY
				</app-button>
				<app-button
					(click)="singInNFID()"
					[type]="'submit'"
				>
					<i class="fa-solid fa-arrow-right-to-bracket"></i>
					Sign In with NFID
				</app-button>
			</div>
		</mat-card>
	</ng-container>
</div>


<ng-template #singedIn>
	<app-button
		(click)="navigateToBlog()"
	>
		Go to blog
	</app-button>

</ng-template>
